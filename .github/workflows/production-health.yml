name: SPORTON production health
on:
  schedule:
    - cron: '43 * * * *'
  workflow_dispatch:
  workflow_run:
    workflows: ['Deploy score site']
    types: [completed]
permissions:
  contents: read
concurrency:
  group: sporton-production-health
  cancel-in-progress: false
jobs:
  check:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check public pages, APIs, freshness and error handling
        run: node scripts/production-check.cjs
