name: Deploy score site
on:
  push:
    branches: [main]
    paths:
      - '*.html'
      - '*.css'
      - '*.js'
      - 'server/**'
      - 'src/**'
      - 'scripts/build-ui.cjs'
      - 'package.json'
      - 'package-lock.json'
      - 'manifest.json'
      - '_config.yml'
      - '_redirects'
      - 'data/**'
      - '.github/workflows/pages.yml'
  workflow_run:
    workflows: ['Collect Korean scores']
    types: [completed]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    # A controlled domestic outage may still have saved healthy overseas data.
    # Always deploy the checked and tested main branch after the collector finishes.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' || github.event.workflow_run.name == 'Collect Korean scores'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
      - run: npm run build
      - name: Verify committed browser bundles
        run: git diff --exit-code -- astryx-ui.js astryx-ui.css astryx-ui.js.LEGAL.txt third-party-notices.txt
      - name: Validate the exact checkout before publishing
        run: npm run check
      - uses: actions/configure-pages@v5
      - name: Audit team and record data
        run: npm run data:audit
      - name: Prepare public files
        run: |
          mkdir -p _site
          cp astryx-ui.js astryx-ui.css astryx-ui.js.LEGAL.txt third-party-notices.txt _redirects index.html privacy.html tokens.css styles.css app.js sports-core.js team-logos.js score-center.js score-center.css watchboard.js watchboard.css score-alerts.js score-diagnostics.js football-standings.js football-standings.css sporton-config.js sw.js manifest.json CNAME robots.txt sitemap.xml _site/
          mkdir -p _site/data
          cp -R data/domestic data/overseas data/standings data/teams _site/data/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
