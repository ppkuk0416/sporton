name: Deploy score site
on:
  push:
    branches: [main]
    paths:
      - '*.html'
      - '*.css'
      - '*.js'
      - 'ai-engine/**'
      - 'server/**'
      - 'manifest.json'
      - 'data/**'
      - '.github/workflows/pages.yml'
  workflow_run:
    workflows: ['Collect Korean scores', 'SPORTON AI pipeline']
    types: [completed]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate the exact checkout before publishing
        run: npm run check
      - name: Use the AI snapshot from the completed pipeline
        if: github.event_name == 'workflow_run' && github.event.workflow_run.name == 'SPORTON AI pipeline'
        uses: actions/download-artifact@v4
        with:
          name: sporton-ai-public
          path: data/ai
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}
      - uses: actions/configure-pages@v5
      - name: Prepare public files
        run: |
          mkdir -p _site
          cp index.html ai.html privacy.html styles.css app.js sports-core.js score-center.js score-center.css watchboard.js watchboard.css score-alerts.js score-diagnostics.js ai-dashboard.js ai-dashboard.css football-standings.js football-standings.css sporton-config.js sw.js manifest.json CNAME robots.txt sitemap.xml _site/
          cp -R data _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
