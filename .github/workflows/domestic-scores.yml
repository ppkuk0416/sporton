name: Collect Korean scores
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/domestic-scores.yml'
      - 'scripts/collect-domestic.cjs'
      - 'scripts/collect-standings.cjs'
      - 'football-standings.js'
      - 'server/**'
      - 'sports-core.js'
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: domestic-scores
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Collect and distinguish a domestic outage
        id: collect
        shell: bash
        run: |
          set +e
          npm run collect
          code=$?
          set -e
          if [ "$code" -eq 2 ]; then
            echo "domestic_outage=true" >> "$GITHUB_OUTPUT"
          elif [ "$code" -ne 0 ]; then
            exit "$code"
          fi
      - name: Commit data when changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "data: refresh Korean sports scores"
          git pull --rebase origin main
          git push origin main
      - name: Report domestic outage after saving available data
        if: steps.collect.outputs.domestic_outage == 'true'
        run: |
          echo '::error::All domestic providers failed. Overseas data was saved when available; domestic data needs attention.'
          exit 1
