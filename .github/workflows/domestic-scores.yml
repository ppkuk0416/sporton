name: Collect Korean scores
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/domestic-scores.yml'
      - 'scripts/collect-domestic.cjs'
      - 'server/**'
      - 'sports-core.js'
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: domestic-scores
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run collect
      - name: Commit data when changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "data: refresh Korean sports scores"
          git pull --rebase origin main
          git push origin main
