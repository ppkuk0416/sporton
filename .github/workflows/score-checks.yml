name: Score checks
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
      - run: npm run build
      - name: Verify committed browser bundles
        run: git diff --exit-code -- astryx-ui.js astryx-ui.css astryx-ui.js.LEGAL.txt third-party-notices.txt
      - run: npm run check
      - run: npm run data:audit
      - run: npm run skills:check
